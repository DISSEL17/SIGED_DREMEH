<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SIGED DREMEH - <ui:insert name="titulo">Sistema</ui:insert></title>
    <!-- Bootstrap 5 (CDN). Para trabajar sin internet, copiar los archivos a resources/ y usar h:outputStylesheet. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <h:outputStylesheet library="css" name="siged.css"/>
</h:head>
<h:body>
    <f:metadata><ui:insert name="metadata"/></f:metadata>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-siged">
        <div class="container">
            <h:link outcome="/dashboard" styleClass="navbar-brand" value="SIGED DREMEH"/>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                    aria-expanded="false" aria-label="Mostrar menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><h:link outcome="/dashboard" styleClass="nav-link" value="Panel"/></li>
                    <li class="nav-item"><h:link outcome="/documentos/lista" styleClass="nav-link" value="Documentos"/></li>
                    <li class="nav-item">
                        <h:link outcome="/documentos/registro" styleClass="nav-link" value="Registrar"
                                rendered="#{loginBean.puedeRegistrar}"/>
                    </li>
                </ul>
                <h:form styleClass="d-flex align-items-center">
                    <span class="navbar-text me-3">
                        #{loginBean.actual.nombreUsuario} (#{loginBean.actual.rol})
                    </span>
                    <h:commandButton value="Salir" action="#{loginBean.cerrar}"
                                     styleClass="btn btn-outline-light btn-sm"/>
                </h:form>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h:messages globalOnly="true" infoClass="alert alert-success d-block"
                    errorClass="alert alert-danger d-block" layout="list" styleClass="mensajes"/>
        <ui:insert name="contenido">Contenido</ui:insert>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
